name: M5 Executor

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

  repository_dispatch:
    types: [run-m5]
jobs:
  execute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run M5 executor
        env:
          DERIV_TOKEN:      ${{ secrets.DERIV_TOKEN }}
          DERIV_APP_ID:     ${{ secrets.DERIV_APP_ID }}
          DERIV_ACCOUNT:    ${{ secrets.DERIV_ACCOUNT }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PERSONAL_ID: ${{ secrets.TELEGRAM_PERSONAL_ID }}
        run: python bot.py --mode m5
      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin master
          git add state/market_state.json
          git diff --staged --quiet || git commit -m "M5 exec: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
