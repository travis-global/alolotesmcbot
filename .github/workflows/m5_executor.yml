name: M5 Executor

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes
  workflow_dispatch:        # allows manual trigger from GitHub Actions tab

jobs:
  execute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run M5 executor
        env:
          DERIV_TOKEN:  ${{ secrets.DERIV_TOKEN }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_ACCOUNT: ${{ secrets.DERIV_ACCOUNT }}
        run: python bot.py --mode m5

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/market_state.json
          git diff --staged --quiet || git commit -m "M5 exec: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
